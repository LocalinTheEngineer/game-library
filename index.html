<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Game Library</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@500;600;700&display=swap');

  :root{
    --bg:#0E1116;
    --bg-elevated:#141920;
    --bg-card:#171D26;
    --border:#262E3A;
    --text:#E8ECF1;
    --text-dim:#9BA6B4;
    --text-faint:#6B7686;
    --accent:#8567FF;
    --accent-strong:#7C5CFC;
    --accent-ink:#FFFFFF;
    --status-playing:#F5A623;
    --status-completed:#34D399;
    --status-backlog:#7C8798;
    --status-dropped:#FB7185;
    --star:#F0B429;
    --shadow:0 16px 40px rgba(0,0,0,0.4);
    --radius:10px;
    --font-display:'Space Grotesk', sans-serif;
    --font-body:'Inter', sans-serif;
    --font-mono:'JetBrains Mono', monospace;
  }

  :root[data-theme="light"]{
    --bg:#F1F3F6;
    --bg-elevated:#FFFFFF;
    --bg-card:#FFFFFF;
    --border:#E1E5EB;
    --text:#161B22;
    --text-dim:#4B5768;
    --text-faint:#8A93A1;
    --accent:#6D46FB;
    --accent-strong:#6D46FB;
    --accent-ink:#FFFFFF;
    --shadow:0 16px 40px rgba(15,23,42,0.09);
  }

  *,*::before,*::after{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; }
  body{
    background:var(--bg);
    color:var(--text);
    font-family:var(--font-body);
    -webkit-font-smoothing:antialiased;
    min-height:100vh;
  }
  h1,h2,h3{ font-family:var(--font-display); margin:0; letter-spacing:-0.01em; }
  p{ margin:0; }
  button, select, input, textarea{ font-family:inherit; color:inherit; }
  button{ cursor:pointer; }
  ::selection{ background:var(--accent); color:#fff; }
  *:focus-visible{ outline:2px solid var(--accent); outline-offset:2px; border-radius:4px; }

  .hidden{ display:none !important; }

  #app{ max-width:1140px; margin:0 auto; padding:0 24px 64px; }

  /* ---------- Topbar ---------- */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    gap:16px; padding:24px 0 20px; flex-wrap:wrap;
    border-bottom:1px solid var(--border); margin-bottom:28px;
  }
  .brand{ display:flex; align-items:baseline; gap:10px; }
  .brand h1{ font-size:22px; font-weight:700; }
  .brand .tag{
    font-family:var(--font-mono); font-size:11px; color:var(--text-faint);
    border:1px solid var(--border); padding:2px 8px; border-radius:999px;
  }
  nav.tabs{
    display:flex; gap:4px; background:var(--bg-elevated);
    border:1px solid var(--border); border-radius:10px; padding:4px;
  }
  nav.tabs button{
    background:transparent; border:none; padding:8px 16px; border-radius:7px;
    font-size:14px; font-weight:600; color:var(--text-dim); transition:background .15s, color .15s;
  }
  nav.tabs button.active{ background:var(--accent); color:var(--accent-ink); }
  nav.tabs button:not(.active):hover{ color:var(--text); }
  .topbar-actions{ display:flex; align-items:center; gap:10px; }
  .icon-btn{
    width:38px; height:38px; border-radius:9px; border:1px solid var(--border);
    background:var(--bg-elevated); font-size:16px; display:flex; align-items:center; justify-content:center;
  }
  .icon-btn:hover{ border-color:var(--accent); }
  .btn-primary{
    background:var(--accent); color:var(--accent-ink); border:none; border-radius:9px;
    padding:10px 18px; font-size:14px; font-weight:600; display:inline-flex; align-items:center; gap:6px;
    box-shadow:0 6px 18px rgba(124,92,252,0.35);
  }
  .btn-primary:hover{ background:var(--accent-strong); }
  .btn-secondary{
    background:transparent; border:1px solid var(--border); color:var(--text);
    border-radius:9px; padding:10px 16px; font-size:14px; font-weight:600;
  }
  .btn-secondary:hover{ border-color:var(--text-dim); }
  .btn-danger{
    background:transparent; border:1px solid var(--status-dropped); color:var(--status-dropped);
    border-radius:9px; padding:10px 16px; font-size:14px; font-weight:600;
  }
  .btn-danger:hover{ background:rgba(251,113,133,0.1); }

  /* ---------- Dashboard ---------- */
  .greeting{ font-size:26px; margin-bottom:4px; }
  .greeting-sub{ color:var(--text-dim); font-size:14px; margin-bottom:24px; }

  .stat-strip{
    display:flex; background:var(--bg-card); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden; margin-bottom:36px; box-shadow:var(--shadow);
  }
  .stat-cell{
    flex:1; padding:18px 20px; border-right:1px solid var(--border);
    display:flex; flex-direction:column; gap:4px; min-width:100px;
  }
  .stat-cell:last-child{ border-right:none; }
  .stat-num{ font-family:var(--font-mono); font-size:26px; font-weight:700; }
  .stat-label{ font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--text-faint); }

  section.block{ margin-bottom:40px; }
  .block-head{ display:flex; align-items:baseline; justify-content:space-between; margin-bottom:14px; }
  .block-head h2{ font-size:16px; font-weight:700; }
  .block-head .see-all{ font-size:13px; color:var(--accent); background:none; border:none; font-weight:600; }

  .card-row{ display:grid; grid-template-columns:repeat(auto-fill, minmax(220px,1fr)); gap:14px; }

  /* ---------- Game card ---------- */
  .game-card{
    display:flex; background:var(--bg-card); border:1px solid var(--border);
    border-radius:var(--radius); overflow:hidden; cursor:pointer;
    transition:transform .15s ease, border-color .15s ease;
  }
  .game-card:hover{ transform:translateY(-2px); border-color:var(--text-faint); }
  .card-edge{ width:5px; flex-shrink:0; }
  .card-body{ padding:14px 16px; flex:1; min-width:0; display:flex; flex-direction:column; gap:8px; }
  .card-top{ display:flex; align-items:flex-start; justify-content:space-between; gap:8px; }
  .card-top h3{ font-size:15px; font-weight:600; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .badge{
    font-size:10px; font-weight:700; text-transform:uppercase; letter-spacing:.04em;
    padding:3px 8px; border-radius:999px; background:rgba(255,255,255,0.06); white-space:nowrap;
  }
  :root[data-theme="light"] .badge{ background:rgba(0,0,0,0.05); }
  .card-meta{ font-size:12px; color:var(--text-dim); }
  .card-bottom{ display:flex; align-items:center; justify-content:space-between; margin-top:auto; }
  .hours{ font-family:var(--font-mono); font-size:13px; color:var(--text-dim); }
  .stars{ color:var(--star); font-size:13px; letter-spacing:1px; }

  /* ---------- Empty states ---------- */
  .empty-state{
    text-align:center; padding:56px 24px; border:1px dashed var(--border); border-radius:var(--radius);
    color:var(--text-dim);
  }
  .empty-state .icon{ font-size:32px; margin-bottom:10px; }
  .empty-state h3{ font-size:16px; color:var(--text); margin-bottom:6px; }
  .empty-state p{ font-size:13px; margin-bottom:18px; }

  /* ---------- Library controls ---------- */
  .library-controls{ display:flex; flex-wrap:wrap; gap:12px; align-items:center; margin-bottom:22px; }
  .search-box{ position:relative; flex:1; min-width:200px; }
  .search-box input{
    width:100%; background:var(--bg-elevated); border:1px solid var(--border); border-radius:9px;
    padding:10px 14px 10px 34px; font-size:14px; color:var(--text);
  }
  .search-box::before{ content:"🔎"; position:absolute; left:11px; top:50%; transform:translateY(-50%); font-size:13px; opacity:.6; }
  .chip-row{ display:flex; gap:6px; flex-wrap:wrap; }
  .chip{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:999px;
    padding:7px 14px; font-size:13px; font-weight:600; color:var(--text-dim);
  }
  .chip.active{ background:var(--accent); border-color:var(--accent); color:var(--accent-ink); }
  select.filter-select{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:9px;
    padding:9px 12px; font-size:13px; color:var(--text);
  }
  .library-grid{ display:grid; grid-template-columns:repeat(auto-fill, minmax(230px,1fr)); gap:14px; }

  /* ---------- Stats ---------- */
  .stats-grid{ display:grid; grid-template-columns:repeat(auto-fit, minmax(150px,1fr)); gap:14px; margin-bottom:36px; }
  .stat-box{
    background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius);
    padding:18px; box-shadow:var(--shadow);
  }
  .stat-box .stat-num{ font-size:24px; }
  .chart-block{ background:var(--bg-card); border:1px solid var(--border); border-radius:var(--radius); padding:22px; margin-bottom:20px; box-shadow:var(--shadow); }
  .chart-block h3{ font-size:14px; margin-bottom:16px; }
  .bar-row{ display:flex; align-items:center; gap:12px; margin-bottom:10px; }
  .bar-row:last-child{ margin-bottom:0; }
  .bar-label{ width:90px; flex-shrink:0; font-size:12px; color:var(--text-dim); text-align:right; }
  .bar-track{ flex:1; background:var(--border); border-radius:6px; height:10px; overflow:hidden; }
  .bar-fill{ height:100%; border-radius:6px; }
  .bar-count{ width:28px; flex-shrink:0; font-family:var(--font-mono); font-size:12px; color:var(--text-dim); }

  /* ---------- Modal ---------- */
  .modal-overlay{
    position:fixed; inset:0; background:rgba(6,8,12,0.6); backdrop-filter:blur(2px);
    display:flex; align-items:center; justify-content:center; padding:20px; z-index:50;
  }
  .modal{
    background:var(--bg-elevated); border:1px solid var(--border); border-radius:14px;
    width:100%; max-width:440px; max-height:88vh; overflow-y:auto; padding:26px;
    box-shadow:0 30px 70px rgba(0,0,0,0.5);
  }
  .modal-head{ display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; }
  .modal-head h2{ font-size:18px; }
  .modal-close{ background:none; border:none; font-size:20px; color:var(--text-faint); line-height:1; }
  .field{ margin-bottom:16px; }
  .field label{ display:block; font-size:12px; font-weight:600; color:var(--text-dim); margin-bottom:6px; }
  .field input[type="text"], .field input[type="number"], .field select, .field textarea{
    width:100%; background:var(--bg); border:1px solid var(--border); border-radius:8px;
    padding:10px 12px; font-size:14px; color:var(--text);
  }
  .field textarea{ resize:vertical; min-height:70px; font-family:inherit; }
  .field-row{ display:flex; gap:12px; }
  .field-row .field{ flex:1; }
  .star-picker{ display:flex; gap:4px; font-size:22px; color:var(--star); }
  .star-picker span{ cursor:pointer; user-select:none; opacity:.35; }
  .star-picker span.filled{ opacity:1; }
  .modal-actions{ display:flex; justify-content:space-between; align-items:center; margin-top:22px; gap:10px; }
  .modal-actions .right-group{ display:flex; gap:8px; margin-left:auto; }

  footer.credit{ text-align:center; padding-top:24px; color:var(--text-faint); font-size:12px; font-family:var(--font-mono); }

  @media (max-width:640px){
    .topbar{ flex-direction:column; align-items:stretch; }
    nav.tabs{ order:3; }
    .stat-strip{ flex-wrap:wrap; }
    .stat-cell{ min-width:45%; border-bottom:1px solid var(--border); }
    .bar-label{ width:64px; font-size:11px; }
  }

  @media (prefers-reduced-motion: reduce){
    *{ transition:none !important; animation:none !important; }
  }
</style>
</head>
<body>

<div id="app">

  <header class="topbar">
    <div class="brand">
      <h1>🎮 Game Library</h1>
      <span class="tag">v1 · local</span>
    </div>
    <nav class="tabs">
      <button class="nav-btn active" data-view="dashboard">Dashboard</button>
      <button class="nav-btn" data-view="library">Library</button>
      <button class="nav-btn" data-view="stats">Stats</button>
    </nav>
    <div class="topbar-actions">
      <button class="icon-btn" id="btn-theme-toggle" title="Toggle theme" aria-label="Toggle theme">🌙</button>
      <button class="btn-primary" id="btn-add-game">+ Add Game</button>
    </div>
  </header>

  <!-- DASHBOARD -->
  <main id="view-dashboard" class="view">
    <h2 class="greeting">Welcome back 👋</h2>
    <p class="greeting-sub">Here's what's happening in your library.</p>

    <div id="dashboard-stats" class="stat-strip"></div>

    <section class="block">
      <div class="block-head">
        <h2>Continue Playing</h2>
        <button class="see-all" data-goto="library">See all →</button>
      </div>
      <div id="continue-playing-row" class="card-row"></div>
    </section>

    <section class="block">
      <div class="block-head">
        <h2>Recently Added</h2>
        <button class="see-all" data-goto="library">See all →</button>
      </div>
      <div id="recent-added-row" class="card-row"></div>
    </section>
  </main>

  <!-- LIBRARY -->
  <main id="view-library" class="view hidden">
    <div class="library-controls">
      <div class="search-box">
        <input type="text" id="search-input" placeholder="Search games…">
      </div>
      <div class="chip-row" id="status-chips">
        <button class="chip active" data-status="all">All</button>
        <button class="chip" data-status="playing">Playing</button>
        <button class="chip" data-status="completed">Completed</button>
        <button class="chip" data-status="backlog">Backlog</button>
        <button class="chip" data-status="dropped">Dropped</button>
      </div>
      <select class="filter-select" id="filter-genre">
        <option value="all">All Genres</option>
        <option>Action</option><option>RPG</option><option>Adventure</option>
        <option>Strategy</option><option>Horror</option><option>Simulation</option>
        <option>Sandbox</option><option>Sports</option><option>Racing</option>
        <option>Puzzle</option><option>Shooter</option><option>Other</option>
      </select>
      <select class="filter-select" id="sort-select">
        <option value="recent">Recently Added</option>
        <option value="name">Name A–Z</option>
        <option value="rating">Highest Rated</option>
        <option value="hours">Most Played</option>
      </select>
    </div>
    <div id="library-grid" class="library-grid"></div>
  </main>

  <!-- STATS -->
  <main id="view-stats" class="view hidden">
    <div id="stats-content"></div>
  </main>

  <footer class="credit">Data is stored locally in this browser · No account needed for v1</footer>
</div>

<!-- MODAL -->
<div id="modal-overlay" class="modal-overlay hidden">
  <div class="modal">
    <div class="modal-head">
      <h2 id="modal-title">Add Game</h2>
      <button class="modal-close" id="modal-close" aria-label="Close">✕</button>
    </div>
    <form id="game-form">
      <div class="field">
        <label for="form-name">Game Name</label>
        <input type="text" id="form-name" required placeholder="e.g. Cyberpunk 2077">
      </div>
      <div class="field-row">
        <div class="field">
          <label for="form-genre">Genre</label>
          <select id="form-genre">
            <option>Action</option><option>RPG</option><option>Adventure</option>
            <option>Strategy</option><option>Horror</option><option>Simulation</option>
            <option>Sandbox</option><option>Sports</option><option>Racing</option>
            <option>Puzzle</option><option>Shooter</option><option>Other</option>
          </select>
        </div>
        <div class="field">
          <label for="form-platform">Platform</label>
          <select id="form-platform">
            <option>PC</option><option>PlayStation</option><option>Xbox</option>
            <option>Nintendo</option><option>Mobile</option><option>Other</option>
          </select>
        </div>
      </div>
      <div class="field-row">
        <div class="field">
          <label for="form-status">Status</label>
          <select id="form-status">
            <option value="playing">Playing</option>
            <option value="completed">Completed</option>
            <option value="backlog">Backlog</option>
            <option value="dropped">Dropped</option>
          </select>
        </div>
        <div class="field">
          <label for="form-hours">Hours Played</label>
          <input type="number" id="form-hours" min="0" step="1" value="0">
        </div>
      </div>
      <div class="field">
        <label>Rating</label>
        <div class="star-picker" id="form-rating"></div>
      </div>
      <div class="field">
        <label for="form-notes">Notes</label>
        <textarea id="form-notes" placeholder="Your thoughts on this game…"></textarea>
      </div>
      <div class="modal-actions">
        <button type="button" class="btn-danger hidden" id="btn-delete">Delete</button>
        <div class="right-group">
          <button type="button" class="btn-secondary" id="btn-cancel">Cancel</button>
          <button type="submit" class="btn-primary">Save Game</button>
        </div>
      </div>
    </form>
  </div>
</div>

<script>
(function(){
  "use strict";

  var STORAGE_KEY = "gl_games_v1";
  var THEME_KEY = "gl_theme_v1";

  var statusMeta = {
    playing:   { label:"Playing",   varName:"--status-playing" },
    completed: { label:"Completed", varName:"--status-completed" },
    backlog:   { label:"Backlog",   varName:"--status-backlog" },
    dropped:   { label:"Dropped",   varName:"--status-dropped" }
  };

  var games = [];
  var currentView = "dashboard";
  var editingId = null;
  var formRating = 0;
  var filters = { search:"", status:"all", genre:"all", sort:"recent" };

  /* ---------- storage ---------- */
  function uid(){
    return "g_" + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
  }

  function seedGames(){
    var now = Date.now();
    var day = 86400000;
    return [
      { id:uid(), name:"Cyberpunk 2077", genre:"RPG", platform:"PC", status:"playing", hours:82, rating:5, notes:"Night City is beautiful once you look past the bugs.", addedAt: now - 1*day },
      { id:uid(), name:"Elden Ring", genre:"RPG", platform:"PC", status:"completed", hours:71, rating:5, notes:"Best boss design in years.", addedAt: now - 3*day },
      { id:uid(), name:"Grand Theft Auto V", genre:"Action", platform:"PC", status:"completed", hours:156, rating:5, notes:"", addedAt: now - 6*day },
      { id:uid(), name:"Minecraft", genre:"Sandbox", platform:"PC", status:"playing", hours:320, rating:4, notes:"Still building the castle.", addedAt: now - 8*day },
      { id:uid(), name:"The Witcher 3", genre:"RPG", platform:"PC", status:"backlog", hours:0, rating:0, notes:"", addedAt: now - 10*day },
      { id:uid(), name:"Hollow Knight", genre:"Adventure", platform:"Nintendo", status:"backlog", hours:2, rating:0, notes:"", addedAt: now - 12*day },
      { id:uid(), name:"Fallout 76", genre:"Shooter", platform:"PC", status:"dropped", hours:6, rating:2, notes:"Not for me.", addedAt: now - 20*day }
    ];
  }

  function loadGames(){
    var raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) return null;
    try{ return JSON.parse(raw); } catch(e){ return null; }
  }

  function saveGames(){
    localStorage.setItem(STORAGE_KEY, JSON.stringify(games));
  }

  /* ---------- helpers ---------- */
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;", "'":"&#39;" })[c];
    });
  }

  function starsHtml(rating){
    var s = "";
    for(var i=1;i<=5;i++){ s += (i<=rating ? "★" : "☆"); }
    return s;
  }

  function sum(arr){ return arr.reduce(function(a,b){ return a+b; }, 0); }

  /* ---------- filtering ---------- */
  function getFilteredGames(){
    var list = games.slice();
    if(filters.search){
      var q = filters.search.toLowerCase();
      list = list.filter(function(g){ return g.name.toLowerCase().indexOf(q) !== -1; });
    }
    if(filters.status !== "all"){
      list = list.filter(function(g){ return g.status === filters.status; });
    }
    if(filters.genre !== "all"){
      list = list.filter(function(g){ return g.genre === filters.genre; });
    }
    switch(filters.sort){
      case "name": list.sort(function(a,b){ return a.name.localeCompare(b.name); }); break;
      case "rating": list.sort(function(a,b){ return b.rating - a.rating; }); break;
      case "hours": list.sort(function(a,b){ return b.hours - a.hours; }); break;
      default: list.sort(function(a,b){ return b.addedAt - a.addedAt; });
    }
    return list;
  }

  /* ---------- render: game card ---------- */
  function gameCardHtml(g){
    var meta = statusMeta[g.status];
    return '' +
      '<article class="game-card" data-id="' + g.id + '" tabindex="0">' +
        '<div class="card-edge" style="background:var(' + meta.varName + ')"></div>' +
        '<div class="card-body">' +
          '<div class="card-top">' +
            '<h3>' + escapeHtml(g.name) + '</h3>' +
            '<span class="badge" style="color:var(' + meta.varName + ')">' + meta.label + '</span>' +
          '</div>' +
          '<p class="card-meta">' + escapeHtml(g.genre) + ' • ' + escapeHtml(g.platform) + '</p>' +
          '<div class="card-bottom">' +
            '<span class="hours">' + g.hours + 'h</span>' +
            '<span class="stars">' + starsHtml(g.rating) + '</span>' +
          '</div>' +
        '</div>' +
      '</article>';
  }

  function emptyStateHtml(icon, title, msg, showCta){
    return '' +
      '<div class="empty-state">' +
        '<div class="icon">' + icon + '</div>' +
        '<h3>' + title + '</h3>' +
        '<p>' + msg + '</p>' +
        (showCta ? '<button class="btn-primary" id="btn-empty-add">+ Add your first game</button>' : '') +
      '</div>';
  }

  /* ---------- render: dashboard ---------- */
  function renderDashboard(){
    var total = games.length;
    var playing = games.filter(function(g){ return g.status === "playing"; }).length;
    var completed = games.filter(function(g){ return g.status === "completed"; }).length;
    var backlog = games.filter(function(g){ return g.status === "backlog"; }).length;
    var totalHours = sum(games.map(function(g){ return g.hours; }));

    var stripEl = document.getElementById("dashboard-stats");
    stripEl.innerHTML =
      statCell(total, "Games") +
      statCell(playing, "Playing") +
      statCell(completed, "Completed") +
      statCell(backlog, "Backlog") +
      statCell(totalHours, "Hours Played");

    var playingRow = document.getElementById("continue-playing-row");
    var playingList = games.filter(function(g){ return g.status === "playing"; })
      .sort(function(a,b){ return b.hours - a.hours; }).slice(0,4);
    playingRow.innerHTML = playingList.length
      ? playingList.map(gameCardHtml).join("")
      : emptyStateHtml("🎯", "Nothing in progress", "Mark a game as Playing to see it here.", false);

    var recentRow = document.getElementById("recent-added-row");
    var recentList = games.slice().sort(function(a,b){ return b.addedAt - a.addedAt; }).slice(0,4);
    recentRow.innerHTML = recentList.length
      ? recentList.map(gameCardHtml).join("")
      : emptyStateHtml("📦", "Your shelf is empty", "Add your first game to start tracking your library.", true);
  }

  function statCell(num, label){
    return '<div class="stat-cell"><span class="stat-num">' + num + '</span><span class="stat-label">' + label + '</span></div>';
  }

  /* ---------- render: library ---------- */
  function renderLibraryGrid(){
    var grid = document.getElementById("library-grid");
    var list = getFilteredGames();
    if(games.length === 0){
      grid.innerHTML = emptyStateHtml("📦", "Your shelf is empty", "Add your first game to start tracking your library.", true);
      return;
    }
    if(list.length === 0){
      grid.innerHTML = emptyStateHtml("🔍", "No matches", "No games fit these filters — try widening your search.", false);
      return;
    }
    grid.innerHTML = list.map(gameCardHtml).join("");
  }

  /* ---------- render: stats ---------- */
  function renderStats(){
    var el = document.getElementById("stats-content");
    if(games.length === 0){
      el.innerHTML = emptyStateHtml("📊", "No data yet", "Add a few games and your stats will show up here.", true);
      return;
    }
    var total = games.length;
    var completed = games.filter(function(g){ return g.status === "completed"; }).length;
    var playing = games.filter(function(g){ return g.status === "playing"; }).length;
    var backlog = games.filter(function(g){ return g.status === "backlog"; }).length;
    var dropped = games.filter(function(g){ return g.status === "dropped"; }).length;
    var totalHours = sum(games.map(function(g){ return g.hours; }));
    var rated = games.filter(function(g){ return g.rating > 0; });
    var avgRating = rated.length ? (sum(rated.map(function(g){ return g.rating; })) / rated.length).toFixed(1) : "–";

    var genreCounts = {};
    games.forEach(function(g){ genreCounts[g.genre] = (genreCounts[g.genre] || 0) + 1; });
    var genreEntries = Object.keys(genreCounts).map(function(k){ return [k, genreCounts[k]]; })
      .sort(function(a,b){ return b[1]-a[1]; });
    var maxGenre = Math.max.apply(null, genreEntries.map(function(e){ return e[1]; }));

    var statusRows = [
      ["Playing", playing, "--status-playing"],
      ["Completed", completed, "--status-completed"],
      ["Backlog", backlog, "--status-backlog"],
      ["Dropped", dropped, "--status-dropped"]
    ];
    var maxStatus = Math.max.apply(null, statusRows.map(function(r){ return r[1]; })) || 1;

    el.innerHTML =
      '<div class="stats-grid">' +
        statBox(total, "Total Games") +
        statBox(completed, "Completed") +
        statBox(totalHours, "Hours Played") +
        statBox(avgRating, "Avg. Rating") +
      '</div>' +
      '<div class="chart-block">' +
        '<h3>Games by Genre</h3>' +
        genreEntries.map(function(e){
          return barRow(e[0], e[1], maxGenre, "var(--accent)");
        }).join("") +
      '</div>' +
      '<div class="chart-block">' +
        '<h3>Games by Status</h3>' +
        statusRows.map(function(r){
          return barRow(r[0], r[1], maxStatus, "var(" + r[2] + ")");
        }).join("") +
      '</div>';
  }

  function statBox(num, label){
    return '<div class="stat-box"><div class="stat-num">' + num + '</div><div class="stat-label">' + label + '</div></div>';
  }

  function barRow(label, count, max, color){
    var pct = max > 0 ? Math.round((count / max) * 100) : 0;
    return '' +
      '<div class="bar-row">' +
        '<span class="bar-label">' + escapeHtml(label) + '</span>' +
        '<div class="bar-track"><div class="bar-fill" style="width:' + pct + '%;background:' + color + '"></div></div>' +
        '<span class="bar-count">' + count + '</span>' +
      '</div>';
  }

  function renderAll(){
    renderDashboard();
    renderLibraryGrid();
    renderStats();
  }

  /* ---------- view switching ---------- */
  function switchView(view){
    currentView = view;
    document.querySelectorAll(".view").forEach(function(v){ v.classList.add("hidden"); });
    document.getElementById("view-" + view).classList.remove("hidden");
    document.querySelectorAll(".nav-btn").forEach(function(btn){
      btn.classList.toggle("active", btn.dataset.view === view);
    });
  }

  /* ---------- modal ---------- */
  function renderRatingPicker(){
    var el = document.getElementById("form-rating");
    var html = "";
    for(var i=1;i<=5;i++){
      html += '<span data-value="' + i + '" class="' + (i <= formRating ? "filled" : "") + '">★</span>';
    }
    el.innerHTML = html;
  }

  function openModal(game){
    editingId = game ? game.id : null;
    document.getElementById("modal-title").textContent = game ? "Edit Game" : "Add Game";
    document.getElementById("btn-delete").classList.toggle("hidden", !game);

    document.getElementById("form-name").value = game ? game.name : "";
    document.getElementById("form-genre").value = game ? game.genre : "Action";
    document.getElementById("form-platform").value = game ? game.platform : "PC";
    document.getElementById("form-status").value = game ? game.status : "playing";
    document.getElementById("form-hours").value = game ? game.hours : 0;
    document.getElementById("form-notes").value = game ? game.notes : "";
    formRating = game ? game.rating : 0;
    renderRatingPicker();

    document.getElementById("modal-overlay").classList.remove("hidden");
    document.getElementById("form-name").focus();
  }

  function closeModal(){
    document.getElementById("modal-overlay").classList.add("hidden");
    editingId = null;
  }

  function submitForm(e){
    e.preventDefault();
    var name = document.getElementById("form-name").value.trim();
    if(!name) return;

    var data = {
      name: name,
      genre: document.getElementById("form-genre").value,
      platform: document.getElementById("form-platform").value,
      status: document.getElementById("form-status").value,
      hours: Math.max(0, parseInt(document.getElementById("form-hours").value, 10) || 0),
      rating: formRating,
      notes: document.getElementById("form-notes").value.trim()
    };

    if(editingId){
      var idx = games.findIndex(function(g){ return g.id === editingId; });
      if(idx !== -1){ games[idx] = Object.assign({}, games[idx], data); }
    } else {
      data.id = uid();
      data.addedAt = Date.now();
      games.unshift(data);
    }
    saveGames();
    renderAll();
    closeModal();
  }

  function deleteCurrentGame(){
    var g = games.find(function(g){ return g.id === editingId; });
    if(!g) return;
    if(!confirm('Delete "' + g.name + '" from your library?')) return;
    games = games.filter(function(game){ return game.id !== editingId; });
    saveGames();
    renderAll();
    closeModal();
  }

  /* ---------- theme ---------- */
  function applyTheme(theme){
    if(theme === "light"){
      document.documentElement.setAttribute("data-theme", "light");
      document.getElementById("btn-theme-toggle").textContent = "☀️";
    } else {
      document.documentElement.removeAttribute("data-theme");
      document.getElementById("btn-theme-toggle").textContent = "🌙";
    }
    localStorage.setItem(THEME_KEY, theme);
  }

  function toggleTheme(){
    var isLight = document.documentElement.getAttribute("data-theme") === "light";
    applyTheme(isLight ? "dark" : "light");
  }

  /* ---------- events ---------- */
  function attachEvents(){
    document.querySelectorAll(".nav-btn").forEach(function(btn){
      btn.addEventListener("click", function(){ switchView(btn.dataset.view); });
    });
    document.querySelectorAll("[data-goto]").forEach(function(btn){
      btn.addEventListener("click", function(){ switchView(btn.dataset.goto); });
    });

    document.getElementById("btn-theme-toggle").addEventListener("click", toggleTheme);
    document.getElementById("btn-add-game").addEventListener("click", function(){ openModal(null); });
    document.getElementById("modal-close").addEventListener("click", closeModal);
    document.getElementById("btn-cancel").addEventListener("click", closeModal);
    document.getElementById("modal-overlay").addEventListener("click", function(e){
      if(e.target.id === "modal-overlay") closeModal();
    });
    document.addEventListener("keydown", function(e){
      if(e.key === "Escape" && !document.getElementById("modal-overlay").classList.contains("hidden")) closeModal();
    });

    document.getElementById("game-form").addEventListener("submit", submitForm);
    document.getElementById("btn-delete").addEventListener("click", deleteCurrentGame);
    document.getElementById("form-rating").addEventListener("click", function(e){
      var target = e.target.closest("span[data-value]");
      if(!target) return;
      formRating = parseInt(target.dataset.value, 10);
      renderRatingPicker();
    });

    document.getElementById("search-input").addEventListener("input", function(e){
      filters.search = e.target.value;
      renderLibraryGrid();
    });
    document.getElementById("filter-genre").addEventListener("change", function(e){
      filters.genre = e.target.value;
      renderLibraryGrid();
    });
    document.getElementById("sort-select").addEventListener("change", function(e){
      filters.sort = e.target.value;
      renderLibraryGrid();
    });
    document.getElementById("status-chips").addEventListener("click", function(e){
      var chip = e.target.closest(".chip");
      if(!chip) return;
      filters.status = chip.dataset.status;
      document.querySelectorAll("#status-chips .chip").forEach(function(c){ c.classList.toggle("active", c === chip); });
      renderLibraryGrid();
    });

    // Delegated click for all game cards + "add first game" CTAs across the app
    document.getElementById("app").addEventListener("click", function(e){
      var card = e.target.closest(".game-card");
      if(card){
        var g = games.find(function(game){ return game.id === card.dataset.id; });
        if(g) openModal(g);
        return;
      }
      if(e.target.id === "btn-empty-add"){ openModal(null); }
    });
  }

  /* ---------- init ---------- */
  function init(){
    var saved = loadGames();
    games = saved !== null ? saved : seedGames();
    if(saved === null) saveGames();

    var savedTheme = localStorage.getItem(THEME_KEY) || "dark";
    applyTheme(savedTheme);

    attachEvents();
    renderAll();
    switchView("dashboard");
  }

  init();
})();
</script>
</body>
</html>
